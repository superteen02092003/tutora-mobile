name: tutora
description: "Tutora Mobile App — Nền tảng kết nối gia sư"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.6.1

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Network ---
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  signalr_netcore: ^1.3.6

  # --- Models (immutable + JSON) ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Storage ---
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # --- Media ---
  image_picker: ^1.1.2

  # --- UI ---
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # --- Firebase ---
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # --- Utils ---
  intl: ^0.20.2
  video_player: ^2.11.1
  chewie: ^1.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # --- Code generation (models only) ---
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  very_good_analysis: ^10.1.0
  # riverpod_generator: removed — uses custom_lint_core which breaks with analyzer 7.x (Dart 3.10)
  # Providers are written manually instead (valid Riverpod 2.x pattern)

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/common/
    - assets/icons/

name: tutora
description: "Tutora Mobile App — Nền tảng kết nối gia sư"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management ---
  flutter_riverpod: ^2.6.1

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Network ---
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # --- Storage ---
  flutter_secure_storage: ^9.2.2

  # --- Ghi âm buổi học ---
  # Để "any" có chủ đích: máy chạy lệnh của Claude không có Flutter SDK nên
  # không resolve được version. Chạy `flutter pub get` một lần, pub sẽ ghi
  # version thật vào pubspec.lock, rồi ghim lại bằng caret theo đúng version đó.
  record: any
  path_provider: any
  flutter_foreground_task: any

  # --- Media ---
  # Chỉ dùng để chọn ảnh đại diện từ thư viện (không dùng camera).
  image_picker: ^1.1.2

  # --- UI ---
  google_fonts: ^6.2.1

  # --- Firebase ---
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # --- Utils ---
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # --- Code generation (models only) ---
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  very_good_analysis: ^10.1.0
  # riverpod_generator: removed — uses custom_lint_core which breaks with analyzer 7.x (Dart 3.10)
  # Providers are written manually instead (valid Riverpod 2.x pattern)

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/common/
    - assets/icons/
